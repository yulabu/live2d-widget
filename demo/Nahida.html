<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live2D 本地调试 — 表情预览</title>
<style>
  #expr-panel {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 9999;
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
    font-family: system-ui, sans-serif;
    font-size: 13px;
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 320px;
  }
  #expr-panel.ready { display: flex; }
  #expr-panel span {
    width: 100%;
    margin-bottom: 2px;
    font-weight: 600;
    color: #333;
  }
  #expr-panel button {
    padding: 5px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #f8f8f8;
    cursor: pointer;
    font-size: 12px;
    transition: background .2s;
  }
  #expr-panel button:hover {
    background: #c8e6c9;
    border-color: #81c784;
  }
  #expr-panel button.active {
    background: #4caf50;
    color: #fff;
    border-color: #388e3c;
  }
  #waifu-tool .waifu-expr-btn.active svg {
    fill: #4caf50;
  }
</style>
</head>
<body>
<div id="expr-panel">
  <span>表情预览</span>
  <button data-expr="guang">光</button>
  <button data-expr="hei">嘿</button>
  <button data-expr="lei">泪</button>
  <button data-expr="lh">脸红</button>
  <button data-expr="sq">生气</button>
  <button data-expr="xx">星星</button>
  <button data-expr="yz">严肃</button>
  <button data-expr="zs1">注视1</button>
  <button data-expr="zs2">注视2</button>
  <button data-expr="zs3">注视3</button>
</div>
<script>
  (function() {
    const panel = document.getElementById('expr-panel');

    function setupExpressionPanel() {
      const model = window.waifuModel;
      if (!model) return setTimeout(setupExpressionPanel, 300);

      model.getExpressionIds = function() {
        let modelSetting = null;
        if (this.useCDN && this.modelList) {
          let modelName = this.modelList.models[this.modelId];
          if (Array.isArray(modelName)) modelName = modelName[this.modelTexturesId];
          const path = this.cdnPath + 'model/' + modelName + '/index.json';
          modelSetting = this.modelJSONCache[path];
        } else if (this.models && this.models.length) {
          const path = this.models[this.modelId].paths[this.modelTexturesId];
          modelSetting = this.modelJSONCache[path];
        }
        if (modelSetting && modelSetting.FileReferences && modelSetting.FileReferences.Expressions) {
          return modelSetting.FileReferences.Expressions.map(function(e) { return e.Name; });
        }
        return [];
      };

      model.setExpression = function(name) {
        const ids = this.getExpressionIds();
        let match = null;
        for (let i = 0; i < ids.length; i++) {
          if (ids[i] === name || ids[i].replace(/\.exp3\.json$/i, '') === name) {
            match = ids[i];
            break;
          }
        }
        const expressionId = match || name;
        if (this.cubism5model) {
          try {
            const sub = this.cubism5model.subdelegates.at(0);
            const m = sub.getLive2DManager()._models.at(0);
            if (m && typeof m.setExpression === 'function') {
              m.setExpression(expressionId);
              return;
            }
          } catch(e) {}
        }
        if (this.cubism2model && typeof this.cubism2model.setExpression === 'function') {
          this.cubism2model.setExpression(expressionId);
        }
      };

      panel.classList.add('ready');

      (function buildExprTools() {
        const tool = document.getElementById('waifu-tool');
        if (!tool) return setTimeout(buildExprTools, 200);
        const quitBtn = document.getElementById('waifu-tool-quit');
        const exprs = [
          { id: 'guang', label: '光' },
          { id: 'hei',   label: '嘿' },
          { id: 'lei',   label: '泪' },
          { id: 'lh',    label: '脸红' },
          { id: 'sq',    label: '生气' },
          { id: 'xx',    label: '星星' },
          { id: 'yz',    label: '严肃' },
          { id: 'zs1',   label: '注1' },
          { id: 'zs2',   label: '注2' },
          { id: 'zs3',   label: '注3' },
          { id: null,    label: '重置' },
        ];
        function clearActive() {
          tool.querySelectorAll('.waifu-expr-btn').forEach(function(b) {
            b.classList.remove('active');
          });
          panel.querySelectorAll('button').forEach(function(b) {
            b.classList.remove('active');
          });
        }
        function resetExpr() {
          if (!window.waifuModel || !window.waifuModel.cubism5model) return;
          try {
            var m = window.waifuModel.cubism5model.subdelegates.at(0)
              .getLive2DManager()._models.at(0);
            ['42','43','44','54','55','56','57','58','59','60'].forEach(function(id) {
              try { m.setParameterValueById('Param' + id, 0); } catch(e) {}
            });
          } catch(e) {}
          clearActive();
        }
        exprs.forEach(function(ex) {
          var span = document.createElement('span');
          span.className = 'waifu-expr-btn';
          span.title = ex.label;
          span.innerHTML = ex.id === null
            ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M463 192H315.9L271.2 58.6C269 52.1 262.9 48 256 48s-13 4.1-15.2 10.6L196.1 192H49c-9.4 0-17 7.6-17 17s7.6 17 17 17h138.1l-36.6 110.9c-3.7 11.1 2.3 23.1 13.4 26.8s23.1-2.3 26.8-13.4L230.1 258h51.8l39.4 92.3c3.7 11.1 15.7 17.1 26.8 13.4s17.1-15.7 13.4-26.8L325.4 258H463c9.4 0 17-7.6 17-17s-7.6-17-17-17z"/></svg>'
            : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512z"/></svg>';
          span.addEventListener('click', function() {
            if (ex.id === null) { resetExpr(); return; }
            window.waifuModel.setExpression(ex.id);
            clearActive();
            span.classList.add('active');
            var panelBtn = panel.querySelector('button[data-expr="' + ex.id + '"]');
            if (panelBtn) panelBtn.classList.add('active');
          });
          if (quitBtn) {
            tool.insertBefore(span, quitBtn);
          } else {
            tool.appendChild(span);
          }
        });
      })();

      (function tapHide() {
        let count = 0, timer = null;
        window.addEventListener('live2d:tapbody', function() {
          count++;
          if (timer) clearTimeout(timer);
          if (count >= 3) {
            count = 0;
            const waifu = document.getElementById('waifu');
            if (!waifu) return;
            waifu.style.top = '';
            waifu.style.left = '';
            waifu.classList.remove('waifu-active');
            if (window.waifuModel) window.waifuModel.setExpression('sq');
            setTimeout(function() {
              const m = window.waifuModel;
              if (m && m.cubism5model) {
                try {
                  const model = m.cubism5model.subdelegates.at(0)
                    .getLive2DManager()._models.at(0);
                  ['42','43','44','54','55','56','57','58','59','60'].forEach(function(id) {
                    try { model.setParameterValueById('Param' + id, 0); } catch(e) {}
                  });
                } catch(e) {}
              }
              waifu.classList.add('waifu-active');
            }, 15000);
          } else {
            timer = setTimeout(function() { count = 0; }, 2000);
          }
        });
      })();

      window.waifuRefreshCanvas = function() {
        const m = window.waifuModel;
        if (!m) return;
        const canvas = document.getElementById('live2d');
        if (!canvas) return;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(400 * dpr);
        canvas.height = Math.round(400 * dpr);
        if (m.cubism5model) {
          try {
            const sub = m.cubism5model.subdelegates.at(0);
            if (sub && typeof sub.onResize === 'function') sub.onResize();
          } catch(e) {}
        }
      };

      panel.addEventListener('click', function(e) {
        const btn = e.target.closest('button[data-expr]');
        if (!btn) return;
        window.waifuModel.setExpression(btn.dataset.expr);
        panel.querySelectorAll('button').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
      });
    }

    setupExpressionPanel();
  })();
</script>
<script src="../dist/autoload.js"></script>
</body>
</html>
